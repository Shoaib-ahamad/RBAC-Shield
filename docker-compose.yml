version: '3.8'

services:
  # 1. Relational Database Service (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: rbac_postgres
    restart: always
    environment:
      POSTGRES_DB: rbac_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Caching & Invalidation Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: rbac_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. REST API Application Service (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbac_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development # Set to development to run hot reload / debug queries
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@postgres:5432/rbac_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=access_secret_123_abc_xyz_must_be_long
      - JWT_REFRESH_SECRET=refresh_secret_123_abc_xyz_must_be_long
    depends_on:
      - postgres
      - redis
    # Mount local directories for hot-reloading dev changes
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 4. Single Page Application Client (React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rbac_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # Mount local directories to propagate React hot-module refreshes
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pg_data:
  redis_data:
